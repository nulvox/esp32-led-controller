name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # lets zizmor inspect workflow/action metadata during online audits
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  test:
    name: Test and debug build
    needs: zizmor
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint project content
        run: make lint

      - name: Run tests and debug build
        run: make test

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-build
          if-no-files-found: ignore
          path: |
            .pio/build/debug/firmware.bin
            .pio/build/debug/littlefs.bin

  release:
    name: Build and publish release
    needs: zizmor
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # needed for gh release create to publish tagged artifacts
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build release firmware and filesystem
        run: make build

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp .pio/build/release/firmware.bin dist/esp32-led-controller-${GITHUB_REF_NAME}-firmware.bin
          cp .pio/build/release/littlefs.bin dist/esp32-led-controller-${GITHUB_REF_NAME}-littlefs.bin
          sha256sum dist/* > dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
