name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and debug build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore PlatformIO cache
        uses: actions/cache@v4
        with:
          path: |
            build-cache/platformio
            .pio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'Dockerfile') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Run tests and debug build
        run: make test

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-build
          if-no-files-found: ignore
          path: |
            .pio/build/debug/firmware.bin
            .pio/build/debug/littlefs.bin

  release:
    name: Build and publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore PlatformIO cache
        uses: actions/cache@v4
        with:
          path: |
            build-cache/platformio
            .pio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'Dockerfile') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Build release firmware and filesystem
        run: make build

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp .pio/build/release/firmware.bin dist/esp32-led-controller-${GITHUB_REF_NAME}-firmware.bin
          cp .pio/build/release/littlefs.bin dist/esp32-led-controller-${GITHUB_REF_NAME}-littlefs.bin
          sha256sum dist/* > dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
