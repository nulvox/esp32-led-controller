name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  test:
    name: Test and debug build
    needs: zizmor
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restore PlatformIO cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            build-cache/platformio
            .pio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'Dockerfile') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Lint project content
        run: make lint

      - name: Run tests and debug build
        run: make test

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-build
          if-no-files-found: ignore
          path: |
            .pio/build/debug/firmware.bin
            .pio/build/debug/littlefs.bin

  release:
    name: Build and publish release
    needs: zizmor
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Restore PlatformIO cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            build-cache/platformio
            .pio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'Dockerfile') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Build release firmware and filesystem
        run: make build

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp .pio/build/release/firmware.bin dist/esp32-led-controller-${GITHUB_REF_NAME}-firmware.bin
          cp .pio/build/release/littlefs.bin dist/esp32-led-controller-${GITHUB_REF_NAME}-littlefs.bin
          sha256sum dist/* > dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
